services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cmps-339-sql-server
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd'

    volumes:
      - mssql_data:/var/opt/mssql

    restart: unless-stopped

volumes:
  mssql_data:
